# ---------------------------------------------------------------------------------------------
# Documentation.
#
# Builds the Writerside instance in a JetBrains-provided Docker image and fails the run on any
# error or warning the builder reports. It is a separate workflow from build.yml on purpose: a
# docs change must not queue behind a three-OS Maven matrix, and a broken link must not be able to
# fail the artefact build.
#
# It does not publish. The site is served from software.splatgames.de and is built and uploaded by
# hand; what this workflow guarantees is that whatever gets uploaded was known to be clean first.
# The layout the server expects is written down in .github/RELEASING.md.
#
# The artefact name is derived from the instance id, uppercased: instance `aw` produces
# `webHelpAW2-all.zip`. The `2` is literal and is part of the builder's naming, not a version.
# ---------------------------------------------------------------------------------------------
name: Documentation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Writerside/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'Writerside/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# A second push to the same branch cancels the first.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # <module directory>/<instance id>. The module directory is the one holding writerside.cfg.
  INSTANCE: 'Writerside/aw'
  # The Writerside Docker builder. Pinned: an unpinned builder makes the site's rendering a moving
  # target that no commit here explains.
  DOCKER_VERSION: '2026.07.8925'

jobs:

  # -------------------------------------------------------------------------------------------
  # Build the site and keep both the site archive and the builder's report.
  # -------------------------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.define-ids.outputs.artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # `last-modified="git"` on a topic reads the file's history, which a shallow clone does
          # not have.
          fetch-depth: 0

      - name: Derive the artefact name from the instance id
        id: define-ids
        run: |
          INSTANCE_ID=${INSTANCE#*/}
          INSTANCE_ID_UPPER=$(echo "$INSTANCE_ID" | tr '[:lower:]' '[:upper:]')
          ARTIFACT="webHelp${INSTANCE_ID_UPPER}2-all.zip"
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "Instance $INSTANCE_ID builds $ARTIFACT"

      - name: Build the documentation site
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ env.INSTANCE }}
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Upload the site and the build report
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: |
            artifacts/${{ steps.define-ids.outputs.artifact }}
            artifacts/report.json
          # The built site is what somebody picks up to publish, not just a failure log.
          retention-days: 30

  # -------------------------------------------------------------------------------------------
  # The gate. The checker parses the builder's own report.json and fails on any error it found:
  # a broken link, a missing topic, an unresolved variable.
  # -------------------------------------------------------------------------------------------
  test:
    name: Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the build report
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: artifacts

      - name: Check the build report
        uses: JetBrains/writerside-checker-action@v1
        with:
          instance: ${{ env.INSTANCE }}
