name: 📚 Documentation
description: Something in the documentation is wrong, missing or hard to follow.
title: "[Docs]: "
labels: [ documentation, needs-triage ]
body:
  - type: markdown
    attributes:
      value: |
        This covers both bodies of documentation: the generated API pages and the
        [documentation site](https://software.splatgames.de/docs/aether-weaver/).

        A page that is *wrong* is the most valuable report you can file here. Text that describes
        behaviour the code does not have is worse than no text, because a reader cannot tell it
        from a fact.

  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Documentation site
        - JavaDoc (API pages)
        - README or a repository file
        - IntelliJ plugin help
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page or type
      description: The URL of the page, or the fully qualified type whose JavaDoc is at fault.
      placeholder: "https://software.splatgames.de/docs/aether-weaver/latest/selectors.html"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - It states something the code does not do
        - It is missing something a reader needs
        - It is correct but hard to follow
        - A link, an anchor or a code sample is broken
        - It contradicts another page
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Details
      description: Quote the sentence if you can, and say what the code actually does.
    validations:
      required: true
