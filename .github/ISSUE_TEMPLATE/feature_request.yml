name: ✨ Feature request
description: Something the framework should be able to do and cannot.
title: "[Feature]: "
labels: [ enhancement, needs-triage ]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. A request that starts from what you were trying
        to do is far more likely to end in something that helps everyone.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does the framework stop you?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour, API or option you have in mind. A sketch of the call site helps.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Weave declaration (annotations, selectors)
        - The engine (injection, ordering, verification)
        - Build-time weaving (Maven plugin)
        - Load-time weaving (agent)
        - Runtime weaving (API)
        - Testing (testkit)
        - Plugin SPI (extending the engine)
        - Diagnostics
        - IntelliJ IDEA plugin
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you have used, and why they are not enough.

  - type: dropdown
    id: breaking
    attributes:
      label: Would this break existing behaviour?
      options:
        - "No"
        - "Yes, and I have described the migration below"
        - "I do not know"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and discussions for this
          required: true
        - label: I checked the documentation to be sure it is not already possible
          required: true
        - label: I am willing to work on this
