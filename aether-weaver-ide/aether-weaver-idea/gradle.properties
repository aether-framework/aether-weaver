# The framework artefact the plugin reads its selector grammar and diagnostic catalogue from.
aetherWeaverVersion=0.1.0-SNAPSHOT

# The oldest supported IntelliJ Platform. 2026.2 is the first release that permits a plugin to be
# compiled to Java 25, which every artefact of this framework is. 2026.1 runs on Java 25 but still
# requires plugins to target 21 — see ai-docs/03-tooling/01-intellij-plugin.md §2.
platformVersion=2026.2
platformSinceBuild=262

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
